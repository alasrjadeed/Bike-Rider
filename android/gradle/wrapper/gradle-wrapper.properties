distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned to 8.2.1 on purpose. AGP 8.2.1 + the Huawei AGCP plugin mutate the release
# compile classpath late; Gradle 9.x rejects that with
# "Cannot mutate the dependencies of configuration ':app:releaseCompileClasspath'"
# at :app:processReleaseResources. Gradle 8.2.1 is the newest version this project builds on.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-all.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
